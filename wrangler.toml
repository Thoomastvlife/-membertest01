name = "member-checkout-pages"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "test2"
database_id = "9e8fa572-c3a8-4bfb-93c5-bdaf3f78f11b"

[vars]
SESSION_TTL_HOURS = "12"
# 訂單「付款時效」：訂單建立後幾小時內可以完成付款，超過會自動變成「已過期」（可在訂單列表用「更正」重開，或請客人重新結帳）。
LINK_TTL_HOURS = "3"
# 付款連結「硬」失效時間：連結本身建立後最多可以被打開/操作幾小時，超過就完全打不開，
# 跟上面 3 小時付款時效是兩件事——3 小時只是不能再付款，但頁面在這裡設定的時數內都還能看；超過這裡設定的時數，連結直接失效。
LINK_HARD_EXPIRE_HOURS = "24"
# 後台推播通知（Web Push）用的聯絡資訊，選填，不填也能正常運作：
# VAPID_SUBJECT = "mailto:you@example.com"

# 自助註冊「信箱驗證碼」：預設開啟，設成 "0" 可關閉（註冊頁就不會要求驗證碼）。
# 開啟時需要寄信服務（Resend）：EMAIL_FROM 填已在 Resend 驗證過網域的寄件人，API 金鑰用 secret 設定：
#   wrangler pages secret put RESEND_API_KEY --project-name=member-checkout-pages
EMAIL_VERIFY_ENABLED = "1"
EMAIL_FROM = "咖啡代儲會員驗證系統 <noreply@member.ytgp168.com>"
# 「訂單完成通知信」要用的寄件人，選填。不設定的話會沿用上面的 EMAIL_FROM（跟驗證碼信同一個寄件人）。
# 想讓訂單完成信顯示不同的寄件人名稱／信箱（例如不要顯示「會員驗證系統」），把下面這行取消註解並改成你要的寄件人，
# 記得這個信箱所屬的網域也要先在 Resend 驗證過，不然寄信會失敗。
EMAIL_FROM_ORDER = "咖啡代儲訂單通知 <order@member.ytgp168.com>"

# 每日營運日報：預設寄給「後台 → 員工帳號」裡有填信箱的管理員帳號，這裡不用設定。
# DAILY_REPORT_TO 是「額外」收件人（選填，多個用逗號分隔，例如會計）；會和管理員信箱合併、去重。
# 管理員沒填信箱、這裡也沒設定，就不會寄。
# 另外要設定 secret CRON_SECRET（GitHub Actions 呼叫日報 API 用的金鑰，兩邊要一樣）：
#   wrangler pages secret put CRON_SECRET --project-name=member-checkout-pages
# DAILY_REPORT_TO = "owner@gmail.com"
# 日報寄件人，選填；不填沿用 EMAIL_FROM_ORDER，再沒有就用 EMAIL_FROM。
EMAIL_FROM_REPORT = "咖啡代儲營運日報 <report@member.ytgp168.com>"

# ---- 服務條款／隱私權政策頁面（/terms、/privacy）要顯示的企業資訊 ----
# 這些是「零售業等網路交易定型化契約應記載及不得記載事項」要求公開揭露的基本資訊，上線前請務必填寫正確；
# 沒填的欄位，頁面上會直接顯示「尚未設定」字樣提醒你補上，不會悄悄留白。
BIZ_NAME = "咖啡代儲"
# BIZ_EMAIL = "客服信箱"   # 沒填的話，頁面會沿用 EMAIL_FROM_ORDER 或 EMAIL_FROM 的信箱

# 部署前務必設定這個機密值（用來簽署登入 session）：
#   wrangler pages secret put ADMIN_SESSION_SECRET --project-name=member-checkout-pages
# 建議用一長串隨機字串，例如: openssl rand -hex 32
